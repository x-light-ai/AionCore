# FORK-CUSTOM: XAIWork fork 新增 workflow，不存在于上游，rebase 时无冲突。
# 用途：构建并发布 Linux x86_64 的 aioncore 二进制到当前仓库的 GitHub Release。
# 仅 workflow_dispatch 手动触发：无需预先打 tag，在 Actions 页面输入 version 即可
# 出包。出包源固定为 dev 分支（不受页面所选分支影响）；Release 关联的 tag
# v<version> 由 gh 自动创建并指向 dev HEAD commit。
# 仓库地址用 ${{ github.repository }} 动态取，推到 x-light-ai 即发到 x-light-ai。
name: XAIWork Release (Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，不带前导 v（如 1.0.0）。从当前分支出包并创建 tag v<version>。"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: aioncore
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  AIONUI_EMBED_BUN: "1"
  BUN_VARIANT: default

jobs:
  build-and-release:
    name: Build & release linux-x64
    # Linux x86_64 原生构建于 ubuntu-22.04 (GLIBC 2.35)，与上游 release.yml 一致：
    # 不用 cross，避免其 docker 镜像 gcc 触发 aws-lc-sys 的 memcmp 安全检查。
    runs-on: ubuntu-22.04
    steps:
      # 固定出包源为 dev 分支：无论从哪个分支触发，都构建 dev 的代码。
      - uses: actions/checkout@v6
        with:
          ref: dev

      - name: Resolve version, tag and commit
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          # checkout 出来的 dev HEAD，供 Release tag 指向真实构建 commit。
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xaiwork-release-x86_64-unknown-linux-gnu-ubuntu-22.04

      - name: Build release binary
        shell: bash
        run: cargo build --release --target x86_64-unknown-linux-gnu -p aionui-app

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p dist
          ARCHIVE="aioncore-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/x86_64-unknown-linux-gnu/release -czf "dist/${ARCHIVE}" aioncore
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum aioncore-* > aioncore-checksums.txt

      - name: Upload GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          # 用 --target 让 gh 在 checkout 出的 dev HEAD commit 上创建 tag。
          RELEASE_TARGET: ${{ steps.metadata.outputs.sha }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${REPOSITORY}" \
              --target "${RELEASE_TARGET}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
