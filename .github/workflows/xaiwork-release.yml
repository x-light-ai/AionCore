# FORK-CUSTOM: XAIWork fork 新增 workflow，不存在于上游，rebase 时无冲突。
# 用途：构建并发布 aioncore 二进制到当前仓库的 GitHub Release，覆盖平台：
#   - Linux x86_64 (x86_64-unknown-linux-gnu)
#   - Windows x64  (x86_64-pc-windows-msvc)
# 仅 workflow_dispatch 手动触发：无需预先打 tag，在 Actions 页面输入 version 即可
# 出包。出包源固定为 dev 分支（不受页面所选分支影响）；Release 关联的 tag
# v<version> 由 gh 自动创建并指向 dev HEAD commit。
# 仓库地址用 ${{ github.repository }} 动态取，推到 x-light-ai 即发到 x-light-ai。
name: XAIWork Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，不带前导 v（如 1.0.0）。从当前分支出包并创建 tag v<version>。"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: aioncore
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  AIONUI_EMBED_BUN: "1"
  BUN_VARIANT: default

jobs:
  prepare:
    name: Resolve version and commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      # 固定出包源为 dev 分支：无论从哪个分支触发，都构建 dev 的代码。
      - uses: actions/checkout@v6
        with:
          ref: dev

      - name: Resolve version, tag and commit
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          # checkout 出来的 dev HEAD，供 Release tag 指向真实构建 commit。
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 原生构建于 ubuntu-22.04 (GLIBC 2.35)，与上游 release.yml
          # 一致：不用 cross，避免其 docker 镜像 gcc 触发 aws-lc-sys 的 memcmp
          # 安全检查。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: aioncore
          # Windows x64：crt-static 静态链接 CRT，产物为免依赖的单 exe。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: aioncore.exe
            rustflags: "-C target-feature=+crt-static"
    steps:
      # 固定出包源为 dev 分支：与 prepare job 的 checkout ref 保持一致。
      - uses: actions/checkout@v6
        with:
          ref: dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Fix MSVC linker (remove Git's link.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xaiwork-release-${{ matrix.target }}-${{ matrix.os }}

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          if [[ -n "${RUSTFLAGS:-}" ]]; then
            echo "Using RUSTFLAGS=${RUSTFLAGS}"
          fi
          cargo build --release --target ${{ matrix.target }} -p aionui-app

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          ARCHIVE="aioncore-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" ${{ matrix.binary_name }}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "aioncore-v${env:VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Upload GitHub Release assets
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum aioncore-* > aioncore-checksums.txt

      - name: Upload GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          # 用 --target 让 gh 在 checkout 出的 dev HEAD commit 上创建 tag。
          RELEASE_TARGET: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${REPOSITORY}" \
              --target "${RELEASE_TARGET}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
